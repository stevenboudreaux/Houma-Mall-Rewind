# Deploys the site to GitHub Pages: the game (the current build from the godot-build branch plus the
# play/ files tracked on main) at the site root, and the original game as classic.html. The build is kept
# out of main's history so the repository does not grow with every demo.
# Runs on every push to main and when godot-build changes (its own workflow starts this one).
#
# Two sites (Nov 3 2026, design/godot-build-hosting.md "Two sites"): a Pages site may hold 1 GB and the
# build is more, so this site does not carry the computer packs (w*.desktop.pck). They are served by
# stevenboudreaux/Houma-Mall-Rewind-desktop's site, which tools/publish_build.sh refreshes; the game asks
# for them there (web/shell.html MALL_DESKTOP_SITE). Only what the site serves is deployed: the repo's
# source, design notes and QA pictures are not.
name: Deploy site to Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: main
      - uses: actions/checkout@v4
        with:
          ref: godot-build
          path: build
      # - the game's files at the root: main's tracked play/ files, then the build over them (as before);
      #   they fetch only relative paths, and the owner's sign/prize/shirt/ROM publishing writes the repo
      #   paths through the GitHub API, so it is unaffected;
      # - the original game (the repo's index.html) as classic.html, next to photos.json, photos/,
      #   pending.json, pending/ and review.html; the editor's Publish writes index.html through the API;
      # - every old prototypes/godot-mall/play/*.html address forwards to its new place;
      # - the tab title says only the working title, until the next export carries project.godot's.
      - name: The site
        run: |
          mkdir -p site
          cp -a main/prototypes/godot-mall/play/. site/
          cp -a build/play/. site/
          rm -f site/*.desktop.pck
          cp main/index.html site/classic.html
          for f in review.html photos.json pending.json .nojekyll; do [ -e "main/$f" ] && cp "main/$f" site/; done
          for d in photos pending; do [ -d "main/$d" ] && cp -a "main/$d" site/; done
          python3 main/prototypes/godot-mall/project/tools/desktop_site/patch_index.py site/index.html main/prototypes/godot-mall/project/web/shell.html
          # builds exported before project.godot's name changed: the engine sets the old name as the
          # tab title when it starts, so strip its suffix there (no-op once a new export is published)
          if ! grep -q '<title>Houma Mall Rewind</title>' site/index.html; then
            cat > /tmp/title.js <<'JS'
          <script>(function(){var d=Object.getOwnPropertyDescriptor(Document.prototype,"title");Object.defineProperty(document,"title",{configurable:true,get:function(){return d.get.call(document)},set:function(v){d.set.call(document,String(v).replace(/ - Godot Mall$/,""))}});})();</script>
          JS
            sed -i '/<\/title>/r /tmp/title.js' site/index.html
          fi
          sed -i 's#<title>[^<]*</title>#<title>Houma Mall Rewind</title>#' site/index.html
          P=site/prototypes/godot-mall/play
          mkdir -p $P
          for f in site/*.html; do
            b=$(basename "$f")
            case "$b" in classic.html|review.html) continue;; esac
            printf '%s\n' '<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Houma Mall Rewind</title>' \
              "<meta http-equiv=\"refresh\" content=\"0; url=../../../$b\">" \
              "<script>location.replace(\"../../../$b\" + location.search + location.hash);</script></head>" \
              "<body><p><a href=\"../../../$b\">Houma Mall Rewind</a></p></body></html>" > "$P/$b"
          done
          test -s site/classic.html && test -s site/index.wasm && test -s site/w1.mobile.pck && test -s $P/index.html
          grep -q '<title>Houma Mall Rewind</title>' site/index.html
          grep -q 'MALL_DESKTOP_SITE' site/index.html
          B=$(du -sb site | cut -f1); echo "site: $B bytes"
          [ "$B" -lt 1000000000 ] || { echo "::error::the site is $B bytes, over Pages' 1 GB"; exit 1; }
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
