# Fails when a push or pull request adds a secret: a GitHub token, a key file, an R2 / S3 key next to its
# name, a private key block, a password in a URL ... (.githooks/secret_check.py; CLAUDE-CLOUD.md "Secrets").
# Cheap: it fetches commits and trees only (no files but .githooks/), then reads just the lines the new
# commits add; a normal push takes seconds. It never prints a value, only its first 4 characters.
# GitHub's own secret scanning and push protection stay on as well (they know provider token formats; R2's
# bare hex keys are only recognisable by the words around them, which is what this adds).
# It deploys nothing and needs no secrets.
name: Secret scan
on:
  push:
    branches: ['**']
  pull_request:
permissions:
  contents: read
concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: .githooks
      - name: Check the new commits for secrets
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          BRANCH: ${{ github.ref_name }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            # the checked-out merge commit: parent 2 is the PR head, parent 1 the base
            set -- HEAD^2 --not HEAD^1
          else
            # what this push adds: not on any other branch, not on this branch before the push
            # (an --exclude before --remotes is written without "refs/remotes/": git's rule)
            set -- "$GITHUB_SHA" --not --exclude="origin/$BRANCH" --remotes=origin
            if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] \
               && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
              set -- "$@" "$BEFORE"
            fi
          fi
          echo "commits checked: $(git rev-list --count "$@")"
          python3 .githooks/secret_check.py --range "$@"
