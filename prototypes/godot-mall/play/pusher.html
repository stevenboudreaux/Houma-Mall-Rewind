<!doctype html>
<html lang="en">
<head>

<title>COIN COMET</title>
<!--
  The playable coin pusher in Pocket Change (workstream P, Nov 2026): COIN COMET, the three-player
  pusher played from both sides. Walk up to any of its six positions in the mall and press Play
  (scripts/pusher_play.gd), or open this page directly: pusher.html?pos=<1..6>&name=<title>&year=1995.
  The mechanics are Steven's two-tier machine (Nov 3, 2026; design/research/coin-pusher-mechanics.md),
  with the Silver Falls teardown video (refs/coin_pusher) for the parts: a coin mechanism that
  slides along the top slot; a motorised top shelf (the deck) that slides out toward the glass and
  back in under a fixed back wall, with a gap at the wall to aim for while it is out; the main
  tier an inch lower, whose heap the deck's face pushes to the drop edge; the adjustable lip; the
  payout chute into the cup; the tilt (3 s alarm, the flipper gate to the house). The sides are
  walled with the blue guides: nothing is lost there (the Nov 1 build's side holes are gone).
  Rules: pusher/logic.js (tested with Node). Physics: pusher/sim.js on Rapier (lib/rapier3d-compat.mjs,
  Apache-2.0), real quarters, 120 Hz. Textures: the mall cabinet's own (paint_pusher_game.py).
  The mall page shows this in a full-window frame and listens for "emu-close".
  Kept in this browser (localStorage): each position's machine ("pusher.machine.<pos>": every
  coin's pose, the ledger, the lip) and the sound and quality settings. Money and tickets
  (ECON, Nov 3; design/godot-economy.md): each drop takes 25 cents (CONFIG.priceCents) from the
  wallet shared by both years ("mall.money"), each coin into the cup pays 50 tickets to this year's
  tickets ("mall.tickets-<year>"), both through lib/mallbank.js at the moment it happens.
  Test hooks: window.PUSHER_PAGE (the sim, drop/nudge, stats) for tests/unit/pusher/page_test.py.
-->
<style>
  :root { --bg: #07060a; --fg: #f4f0e8; --dim: #a49eb2; --accent: #ffd23c; --red: #ff3a1e; --blue: #4a7cff; --line: #2a2634; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); overflow: hidden;
               font: 16px/1.4 -apple-system, "Helvetica Neue", Arial, sans-serif; -webkit-user-select: none; user-select: none;
               -webkit-touch-callout: none; touch-action: none; }
  #bar { position: fixed; top: 0; left: 0; right: 0; height: 48px; display: flex; align-items: center; gap: 8px; padding: 0 10px;
         padding-top: env(safe-area-inset-top); background: #000; border-bottom: 1px solid var(--line); z-index: 20; }
  #bar b { flex: 1; letter-spacing: .06em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-style: italic; color: var(--accent); }
  button { font: inherit; color: #1a0a20; background: var(--accent); border: 0; border-radius: 10px; padding: 9px 14px; font-weight: 800; cursor: pointer; }
  button.ghost { background: transparent; color: var(--fg); border: 1px solid #3a3446; font-weight: 600; }
  #stage { position: fixed; top: calc(48px + env(safe-area-inset-top)); left: 0; right: 0; bottom: 0; }
  #gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .chip { position: absolute; top: 10px; padding: 6px 12px; border-radius: 999px; background: rgba(8, 6, 14, .72);
          border: 1px solid rgba(255, 255, 255, .12); font-weight: 700; font-size: 15px; pointer-events: none; z-index: 5;
          font-variant-numeric: tabular-nums; }
  #qtr { right: 10px; text-align: right; }
  #qtr span { color: var(--accent); font-size: 20px; }
  #qtr small { display: block; font-size: 11px; color: var(--dim); font-weight: 600; letter-spacing: .08em; }
  #tkt { right: 10px; top: 72px; text-align: right; }
  #tkt span { color: #ffd23c; font-size: 20px; }
  #tkt small { display: block; font-size: 11px; color: var(--dim); font-weight: 600; letter-spacing: .08em; }
  .plus { position: absolute; left: 50%; bottom: calc(52px + env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 6; pointer-events: none;
          font-weight: 900; font-size: 26px; color: #ffd23c; text-shadow: 0 0 12px rgba(255, 210, 60, .7), 2px 2px 0 #000; animation: plusup 1s ease-out forwards; }
  @keyframes plusup { from { opacity: 1; transform: translate(-50%, 0); } to { opacity: 0; transform: translate(-50%, -60px); } }
  @media (prefers-reduced-motion: reduce) { .plus { animation: plusfade 1s steps(1) forwards; } @keyframes plusfade { to { opacity: 0; } } }
  #meter { left: 10px; display: flex; align-items: center; gap: 8px; }
  #meter i { display: block; width: 70px; height: 8px; border-radius: 4px; background: #2a2236; overflow: hidden; }
  #meter i b { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #ffd23c, #ff3a1e); transition: width .15s; }
  #meter.hot { color: var(--red); }
  #cup { position: absolute; left: 50%; bottom: calc(14px + env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 5; pointer-events: none;
         padding: 6px 14px; border-radius: 999px; background: rgba(8, 6, 14, .72); border: 1px solid rgba(255, 255, 255, .12); font-weight: 700; font-size: 14px;
         color: var(--dim); white-space: nowrap; transition: transform .15s; }
  #cup.pop { transform: translateX(-50%) scale(1.15); color: var(--accent); }
  #drop { position: absolute; right: 14px; bottom: calc(18px + env(safe-area-inset-bottom)); width: 104px; height: 104px; border-radius: 50%;
          z-index: 6; font-size: 19px; letter-spacing: .06em; color: #2a0404;
          background: radial-gradient(circle at 40% 35%, #ff8a7a 0, #e02a1a 55%, #8a0c08 100%); border: 4px solid #cfd3da; box-shadow: 0 5px 14px rgba(0,0,0,.6); touch-action: none; }
  #drop:active { transform: translateY(2px); }
  #drop:disabled { filter: grayscale(.8) brightness(.6); }
  #bump { position: absolute; left: 14px; bottom: calc(18px + env(safe-area-inset-bottom)); width: 84px; height: 84px; border-radius: 50%;
          z-index: 6; font-size: 15px; color: #fff; background: radial-gradient(circle at 40% 35%, #6a8aff 0, #2a4acc 55%, #10206a 100%);
          border: 4px solid #cfd3da; box-shadow: 0 5px 14px rgba(0,0,0,.6); touch-action: none; }
  #bump:active { transform: translateY(2px); }
  #slot { position: absolute; left: 50%; top: 12px; transform: translateX(-50%); width: min(62vw, 360px); height: 26px; z-index: 6; touch-action: none;
          border-radius: 13px; background: rgba(8, 6, 14, .55); border: 1px solid rgba(255, 255, 255, .18); }
  #slot i { position: absolute; top: 2px; width: 44px; height: 20px; margin-left: -22px; border-radius: 6px; left: 50%;
            background: linear-gradient(180deg, #f2f4f8, #9aa0ac 60%, #d8dce4); box-shadow: 0 2px 6px rgba(0,0,0,.6); }
  #slot i::after { content: ""; position: absolute; left: 12px; right: 12px; top: 8px; height: 4px; border-radius: 2px; background: #22262e; }
  #slot i.open { background: linear-gradient(180deg, #fff2b0, #ffd23c 60%, #ffe680); box-shadow: 0 2px 6px rgba(0,0,0,.6), 0 0 10px rgba(255, 210, 60, .8); }
  #drop.open { border-color: #ffd23c; box-shadow: 0 5px 14px rgba(0,0,0,.6), 0 0 18px rgba(255, 210, 60, .75); }
  #gap { position: absolute; left: 50%; top: 46px; transform: translateX(-50%); z-index: 5; pointer-events: none; font-size: 12px; font-weight: 800;
         letter-spacing: .12em; color: #ffd23c; opacity: 0; transition: opacity .15s; text-shadow: 0 0 8px rgba(255, 210, 60, .6), 1px 1px 0 #000; }
  #gap.open { opacity: 1; }
  #msg { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 7; width: min(420px, calc(100% - 24px)); text-align: center; pointer-events: none; }
  #msg .card { background: rgba(10, 6, 18, .92); border: 1px solid rgba(255, 210, 60, .35); border-radius: 16px; padding: 14px 16px 16px;
               box-shadow: 0 8px 30px rgba(0, 0, 0, .5); pointer-events: auto; }
  #msg h2 { margin: 0 0 4px; font-size: 26px; font-style: italic; letter-spacing: .05em; color: var(--accent);
            text-shadow: 0 0 12px rgba(255, 60, 30, .6), 2px 2px 0 #3a2a90; }
  #msg p { margin: 4px 0 10px; color: #ddd6e8; font-size: 15px; }
  #msg .big { font-size: 20px; padding: 12px 26px; }
  #flash { position: absolute; left: 50%; top: 24%; transform: translate(-50%, -50%); z-index: 6; pointer-events: none; text-align: center;
           font-weight: 900; font-style: italic; font-size: clamp(30px, 9vw, 64px); color: #fff; letter-spacing: .04em; opacity: 0;
           text-shadow: 0 0 18px #ff3a1e, 0 0 4px #ff3a1e, 3px 3px 0 #3a2a90; transition: opacity .2s; white-space: nowrap; }
  #flash.tilt { animation: tiltblink .25s steps(2) infinite; color: #ff3a1e; text-shadow: 0 0 22px #ff3a1e, 3px 3px 0 #000; }
  @keyframes tiltblink { to { opacity: .2; } }
  #hint { position: absolute; left: 50%; bottom: calc(52px + env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 5; pointer-events: none;
          font-size: 13px; color: var(--dim); text-align: center; width: calc(100% - 250px); max-width: 420px; }
  #set { position: fixed; inset: 0; z-index: 25; background: rgba(4, 3, 8, .92); display: none; overflow: auto; padding: 60px 14px 30px; }
  #set .wrap { max-width: 460px; margin: 0 auto; }
  #set h2 { font-style: italic; color: var(--accent); letter-spacing: .05em; margin: 0 0 4px; }
  #set .row { display: flex; align-items: center; gap: 12px; padding: 12px; border: 1px solid var(--line); border-radius: 12px; margin-bottom: 8px; background: #0e0b16; }
  #set .row label { flex: 1; font-weight: 700; }
  #set .row label small { display: block; color: var(--dim); font-weight: 500; font-size: 12px; }
  #set input[type=range] { width: 150px; }
  #set select { font: inherit; background: #1a1424; color: var(--fg); border: 1px solid var(--line); border-radius: 8px; padding: 6px; }
  #set .close { position: fixed; top: 10px; right: 10px; }
  #set .stat { color: var(--dim); font-size: 13px; margin-top: 10px; font-variant-numeric: tabular-nums; white-space: pre-wrap; }
  #load { position: fixed; inset: 0; z-index: 30; background: radial-gradient(circle at 50% 38%, #10204a 0, #0b0710 60%, #050407 100%);
          display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 16px; }
  #load h1 { margin: 0; font-size: clamp(38px, 11vw, 76px); font-style: italic; letter-spacing: .06em; color: var(--accent);
             text-shadow: 0 0 22px rgba(255, 60, 30, .75), 4px 4px 0 #3a2a90; }
  #load .sub { color: var(--dim); margin: 8px 0 26px; }
  #load .track { width: min(380px, 80vw); height: 10px; border-radius: 6px; background: #2a2236; overflow: hidden; }
  #load .bar { height: 100%; width: 0; background: linear-gradient(90deg, #ff3a1e, #ffd23c); transition: width .2s; }

</style>

<body>
<div id="bar"><button class="ghost" id="back">&#8592; Mall</button><b id="title">COIN COMET</b><button class="ghost" id="gear" style="display:none" aria-label="Settings">&#9881;</button><button class="ghost" id="snd" aria-label="Sound">&#128266;</button></div>
<div id="stage">
  <canvas id="gl"></canvas>
  <div id="slot"><i id="knob"></i></div>
  <div id="gap">GAP OPEN</div>
  <div class="chip" id="meter">TILT <i><b id="meterbar"></b></i></div>
  <div class="chip" id="qtr"><span id="qn">$0.00</span><small>MONEY</small></div>
  <div class="chip" id="tkt"><span id="tn">0</span><small>TICKETS</small></div>
  <div id="cup">CUP &middot; 0</div>
  <button id="bump">NUDGE</button>
  <button id="drop">DROP</button>
  <div id="hint"></div>
  <div id="flash"></div>
  <div id="msg"></div>
</div>
<div id="set"><button class="ghost close" id="setclose">Close</button><div class="wrap"><h2>MACHINE SETTINGS</h2>
  <div class="row"><label>Lip height<small id="lipv">0.5 mm over the main tier (the house's payout control)</small></label><input type="range" id="lip" min="0" max="6" step="0.5"></div>
  <div class="row"><label>Coins<small>how full the machine is: fewer on a slow phone (low also runs the physics at 90 Hz; takes effect on reload)</small></label><select id="quality"><option value="low">Low</option><option value="medium">Medium</option><option value="high">High</option></select></div>
  <div class="row"><label>Refill<small>empty this position and start it fresh</small></label><button id="reset">Refill</button></div>
  <div class="stat" id="stat"></div></div></div>
<div id="load"><h1 id="ltitle">COIN COMET</h1><div class="sub" id="lsub">Pocket Change &middot; coin pusher</div>
  <div class="track"><div class="bar" id="lbar"></div></div><div class="err" id="lerr"></div></div>
<script src="lib/three.min.js"></script>
<script src="pusher/logic.js"></script>
<script src="lib/mallbank.js"></script>
<script type="module">
import RAPIER from './lib/rapier3d-compat.mjs';
import { createSim, GEOM, wallZ, deckOutness } from './pusher/sim.js';
const PL = window.PUSHER, CFG = PL.CONFIG, T3 = window.THREE;
const Q = new URLSearchParams(location.search);
const POS = Math.max(1, Math.min(CFG.positions, parseInt(Q.get('pos'), 10) || 1));
const YEAR = /^\d{4}$/.test(Q.get('year') || '') ? Q.get('year') : '1995';
const NAME = (Q.get('name') || 'COIN COMET').slice(0, 24);
const TESTING = Q.get('test') === '1';
const inFrame = window.parent && window.parent !== window;
document.getElementById('title').textContent = NAME;
document.getElementById('ltitle').textContent = NAME;
document.getElementById('lsub').textContent = 'Pocket Change · coin pusher · position ' + POS + ' of ' + CFG.positions;
document.title = NAME;

// ------------------------------------------------------------------ storage (per browser)
function load(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } }
function save(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
let soundOn = load('pusher.sound', true) !== false;
const isOwner = (function () { try { return localStorage.getItem('southland-editor') === '1' || Q.get('owner') === '1'; } catch (e) { return false; } })();
const mobile = /iPhone|iPad|Android|Mobile/i.test(navigator.userAgent) || (navigator.maxTouchPoints > 1 && Math.min(screen.width, screen.height) < 900);
let quality = load('pusher.quality', null);
if (!CFG.quality[quality]) quality = mobile ? 'low' : 'high';      // the coin count; low also steps the physics at 90 Hz instead of 120 (design note, Performance)
const SIM_HZ = quality === 'low' ? 90 : 120;
// ECON (Nov 3): the wallet (both years) and this year's tickets, read and written at the moment of use
const BANK = window.MALLBANK.make(localStorage), SESSION = window.MALLBANK.session();
let cupSeq = 0, cupSaved = true;   // a cup credit saves the machine after its step, so the coin can't fall twice
function money() { return BANK.money(); }
function tickets() { return BANK.tickets(YEAR); }
function mirror() { try { if (window.parent && window.parent.mall) Object.assign(window.parent.mall, { money: money(), tickets: tickets() }); } catch (e) {} }
const MKEY = PL.machineKey(POS);
function now() { return performance.now(); }

// ------------------------------------------------------------------ renderer
const stage = document.getElementById('stage'), canvas = document.getElementById('gl');
let renderer;
try { renderer = new T3.WebGLRenderer({ canvas, antialias: !mobile, powerPreference: 'high-performance' }); }
catch (e) { document.getElementById('lerr').textContent = 'This browser could not start 3D graphics.'; throw e; }
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, mobile ? 2 : 2));
renderer.outputColorSpace = T3.SRGBColorSpace;
renderer.toneMapping = T3.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
const scene = new T3.Scene();
scene.background = new T3.Color(0x050407);
const camera = new T3.PerspectiveCamera(52, 1, 0.02, 12);

// The cabinet frame (tools/stores/pocket_change/pusher.gd): x to the player's right, y up, z
// into the machine from its front face. three.js looks down -z, so world z = -z_in.
function V(x, y, zin) { return new T3.Vector3(x, y, -zin); }
const G = { PH: 0.2635, Y_SH: 0.82, Z_DROP: 0.12, Y_PT: 0.82 + GEOM.deckY / 100, Z_BACK: 0.12 + wallZ(GEOM) / 100 + 0.015, Y_CEIL: 1.47, Z_BAND: 0.30, Y_BAND: 1.48, Y_TOP: 1.79,
            Y_M0: 1.83, Y_M1: 2.18, Z_M: 0.29, G0: [0.06, 0.78], G1: [0.30, 1.48], Z_WALL: 0.12 + wallZ(GEOM) / 100, Y_WALL: 1.02 };
// sim (cm, shelf-top origin at the drop edge) -> cabinet metres
const S2W = (x, y, z) => V(x / 100, G.Y_SH + y / 100, G.Z_DROP + z / 100);

// ------------------------------------------------------------------ textures
const TEX = {};
const TEX_LIST = ['marquee', 'back', 'front', 'side', 'band', 'mech', 'inner', 'ramp', 'perf', 'glass', 'coins', 'edge', 'quarter', 'steel'];
const loader = new T3.TextureLoader();
function loadAll() {
  return new Promise((done, fail) => {
    let n = 0;
    TEX_LIST.forEach((k) => {
      loader.load('pusher/' + k + '.webp', (t) => {
        t.colorSpace = T3.SRGBColorSpace; t.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
        TEX[k] = t; n++;
        document.getElementById('lbar').style.width = (90 * n / TEX_LIST.length) + '%';
        if (n === TEX_LIST.length) done();
      }, undefined, () => fail(new Error('Could not load the machine (' + k + '). Check the connection and reload.')));
    });
  });
}

// ------------------------------------------------------------------ materials (pusher.gd fill_mat)
const S = T3.MeshStandardMaterial, MATS = {};
function rep(t, u, v) { const c = t.clone(); c.wrapS = c.wrapT = T3.RepeatWrapping; c.repeat.set(u, v); c.needsUpdate = true; return c; }
function mat(k) {
  if (MATS[k]) return MATS[k];
  let m;
  switch (k) {
    case 'marquee': m = new S({ map: TEX.marquee, emissiveMap: TEX.marquee, emissive: 0xffffff, emissiveIntensity: 1.3, roughness: 0.3 }); break;
    case 'back': m = new S({ map: TEX.back, emissiveMap: TEX.back, emissive: 0xffffff, emissiveIntensity: 1.15, roughness: 0.3 }); break;
    case 'front': m = new S({ map: TEX.front, roughness: 0.45 }); break;
    case 'band': m = new S({ map: TEX.band, roughness: 0.45 }); break;
    case 'mech': m = new S({ map: TEX.mech, roughness: 0.25, metalness: 0.3 }); break;
    case 'inner': m = new S({ map: TEX.inner, roughness: 0.5 }); break;
    case 'ramp': m = new S({ map: TEX.ramp, emissiveMap: TEX.ramp, emissive: 0xffffff, emissiveIntensity: 0.45, roughness: 0.3, side: T3.DoubleSide }); break;
    case 'perf': m = new S({ map: rep(TEX.perf, 6, 1.4), roughness: 0.35, metalness: 0.4 }); break;
    case 'glass': m = new S({ map: TEX.glass, transparent: true, opacity: 0.22, roughness: 0.05, metalness: 0.1, side: T3.DoubleSide, depthWrite: false }); break;
    case 'slide': m = new S({ color: 0xffffff, transparent: true, opacity: 0.16, roughness: 0.1, side: T3.DoubleSide, depthWrite: false }); break;
    case 'steel': m = new S({ map: rep(TEX.steel, 3, 3), color: 0xc8ccd2, metalness: 0.75, roughness: 0.38 }); break;
    case 'steeldk': m = new S({ map: rep(TEX.steel, 2, 2), color: 0x3a3e46, metalness: 0.6, roughness: 0.55, side: T3.DoubleSide }); break;
    case 'coinsfx': m = new S({ map: rep(TEX.coins, 1.5, 1), roughness: 0.5, metalness: 0.5 }); break;
    case 'alu': m = new S({ color: 0xd0d4da, metalness: 0.45, roughness: 0.32 }); break;
    case 'chrome': m = new S({ color: 0xeceef2, metalness: 0.7, roughness: 0.18 }); break;
    case 'dark': m = new S({ color: 0x14182a, roughness: 0.6 }); break;
    case 'black': m = new S({ color: 0x050507, roughness: 0.9 }); break;
    case 'cup': m = new S({ color: 0x101012, roughness: 0.45 }); break;
    case 'chute': m = new S({ color: 0xf4f4f0, roughness: 0.3 }); break;
    case 'ceil': m = new S({ color: 0xe8ecf0, emissive: 0xe6eeff, emissiveIntensity: 0.55, roughness: 0.8 }); break;
    case 'tube': m = new S({ color: 0xffffff, emissive: 0xeef5ff, emissiveIntensity: 2.2 }); break;
    case 'bulb': m = new S({ color: 0xffd080, emissive: 0xffb040, emissiveIntensity: 1.6 }); break;
    case 'gate': m = new S({ color: 0x9a9ea6, metalness: 0.6, roughness: 0.4 }); break;
    default: m = new S({ color: 0xff00ff });
  }
  MATS[k] = m; return m;
}

// ------------------------------------------------------------------ the cabinet (one position)
function box(k, cx, cy, czin, sx, sy, sz) { const m = new T3.Mesh(new T3.BoxGeometry(sx, sy, sz), mat(k)); m.position.copy(V(cx, cy, czin)); scene.add(m); return m; }
function quad(k, p, uv) {
  const g = new T3.BufferGeometry();
  const pos = [], uvs = [], idx = [0, 1, 2, 0, 2, 3];
  p.forEach((v, i) => { pos.push(v.x, v.y, v.z); uvs.push(uv ? uv[i][0] : 0, uv ? 1 - uv[i][1] : 0); });
  g.setAttribute('position', new T3.Float32BufferAttribute(pos, 3)); g.setAttribute('uv', new T3.Float32BufferAttribute(uvs, 2)); g.setIndex(idx); g.computeVertexNormals();
  const m = new T3.Mesh(g, mat(k)); scene.add(m); return m;
}
const UVR = [[0, 1], [1, 1], [1, 0], [0, 0]];
let deckMesh, mechMesh, gateMesh, lipMesh, slideMesh;
function buildCabinet() {
  const PH = G.PH, W = GEOM.halfW / 100, third = (POS - 1) % 3;
  // translite (this position's third of the back art), the fins beside it
  quad('back', [V(-PH, G.Y_WALL, G.Z_BACK), V(PH, G.Y_WALL, G.Z_BACK), V(PH, G.Y_CEIL, G.Z_BACK), V(-PH, G.Y_CEIL, G.Z_BACK)],
    [[third / 3, 1], [(third + 1) / 3, 1], [(third + 1) / 3, 0], [third / 3, 0]]);
  for (const s of [-1, 1]) {
    // partition fin (pusher.gd FIN) as a thin box set, and the inner side wall below the glass
    const x = s * (PH - 0.004);
    const zf0 = G.Z_WALL - 0.16, zf1 = G.Z_BACK - 0.004;
    const fin = quad('steeldk', [V(x, G.Y_PT, zf0), V(x, G.Y_PT, zf1), V(x, G.Y_CEIL, zf1), V(x, G.Y_WALL, zf1)]);
    fin.material = mat('steeldk');

// ------------------------------------------------------------------ coins: one instanced mesh
let coinMesh, MAXC = 1000;
const dummy = new T3.Object3D();
function coinGeometry() {
  // a cylinder along y: caps mapped to the quarter texture's halves (heads up, tails down),
  // the rim to the texture's plain corner
  const g = new T3.CylinderGeometry(GEOM.coinR / 100, GEOM.coinR / 100, 2 * GEOM.coinHH / 100, 22, 1, false);
  const uv = g.attributes.uv, pos = g.attributes.position, n = g.attributes.normal;
  for (let i = 0; i < uv.count; i++) {
    const ny = n.getY(i), x = pos.getX(i), z = pos.getZ(i), r = GEOM.coinR / 100;
    if (ny > 0.5) uv.setXY(i, 0.25 + 0.245 * (x / r), 0.5 + 0.49 * (z / r));
    else if (ny < -0.5) uv.setXY(i, 0.75 + 0.245 * (x / r), 0.5 + 0.49 * (z / r));
    else uv.setXY(i, 0.5 + (uv.getX(i) - 0.5) * 0.02, 0.98);
  }
  uv.needsUpdate = true;
  return g;
}
function buildCoins() {
  const m = new S({ map: TEX.quarter, metalness: 0.78, roughness: 0.3, color: 0xffffff });
  coinMesh = new T3.InstancedMesh(coinGeometry(), m, MAXC);
  coinMesh.instanceMatrix.setUsage(T3.DynamicDrawUsage);
  coinMesh.frustumCulled = false;
  scene.add(coinMesh);
}
let trackId = 0, trackMesh = null, trackEvent = null;
function syncCoins() {
  let i = 0;
  if (trackMesh) trackMesh.visible = false;
  const sh = G.Y_SH, zd = G.Z_DROP;
  for (const c of sim.coins.values()) {
    if (i >= MAXC) break;
    const p = c.body.translation(), q = c.body.rotation();
    dummy.position.set(p.x / 100, sh + p.y / 100, -(zd + p.z / 100));
    dummy.quaternion.set(-q.x, -q.y, q.z, q.w);     // the sim's z is into the machine: in the z-mirrored frame a rotation (x,y,z,w) is (-x,-y,z,w)
    dummy.updateMatrix();
    coinMesh.setMatrixAt(i++, dummy.matrix);
    if (trackMesh && c.id === trackId) { trackMesh.position.copy(dummy.position); trackMesh.position.y += 0.004; trackMesh.visible = true; }
  }
  // the coin sliding down the slide (not yet in the sim)
  for (const s of slides) {
    if (i >= MAXC) break;
    const k = Math.min(1, (now() - s.t0) / SLIDE_MS);
    const a = V(s.x / 100, G.Y_BAND + 0.035, G.Z_BAND + 0.03), b = S2W(s.x, GEOM.deckY + GEOM.chuteY + 0.5, wallZ(GEOM) - GEOM.chuteBack);
    dummy.position.lerpVectors(a, b, k);
    dummy.quaternion.setFromEuler(new T3.Euler(-Math.atan2(a.y - b.y, b.z - a.z) * 0 + 0.3, 0, 1.5));
    dummy.updateMatrix();
    coinMesh.setMatrixAt(i++, dummy.matrix);
  }
  coinMesh.count = i;
  coinMesh.instanceMatrix.needsUpdate = true;
}

// ------------------------------------------------------------------ the camera: at the position, looking down through the glass
let shake = 0, shakeT = 0;
function placeCamera() {
  const w = stage.clientWidth, h = stage.clientHeight, portrait = h > w * 1.1;
  camera.aspect = w / h; camera.fov = portrait ? 66 : 50; camera.updateProjectionMatrix();
  camera.position.copy(V(0, portrait ? 1.52 : 1.48, portrait ? -0.42 : -0.52));
  camera.lookAt(V(0, portrait ? 0.80 : 0.86, portrait ? 0.30 : 0.36));
  if (shake > 0) {

  }
}
function resize() { const w = stage.clientWidth, h = stage.clientHeight; renderer.setSize(w, h, false); placeCamera(); }
window.addEventListener('resize', resize);

// ------------------------------------------------------------------ sound (all made here, no samples)
let AC = null, master = null, hum = null, humGain = null, siren = null;
function audio() {
  if (AC || !(window.AudioContext || window.webkitAudioContext)) return AC;
  AC = new (window.AudioContext || window.webkitAudioContext)();
  master = AC.createGain(); master.gain.value = soundOn ? 0.6 : 0; master.connect(AC.destination);
  // the motor: a low hum with a whine, loud enough to notice (the video's is "kind of loud")
  const o1 = AC.createOscillator(), o2 = AC.createOscillator(), f = AC.createBiquadFilter();
  o1.type = 'sawtooth'; o1.frequency.value = 58; o2.type = 'triangle'; o2.frequency.value = 116.5;
  f.type = 'lowpass'; f.frequency.value = 320; f.Q.value = 1.2;
  humGain = AC.createGain(); humGain.gain.value = 0.0;
  const g2 = AC.createGain(); g2.gain.value = 0.35;
  o1.connect(f); o2.connect(g2); g2.connect(f); f.connect(humGain); humGain.connect(master); o1.start(); o2.start();
  hum = { o1, o2 };
  return AC;
}
function unlock() { audio(); if (AC && AC.state === 'suspended') AC.resume(); if (humGain) humGain.gain.setTargetAtTime(0.09, AC.currentTime, 0.5); }
function tone(type, f0, f1, t0, dur, vol, dest) {
  if (!AC) return;
  const o = AC.createOscillator(), g = AC.createGain(); o.type = type;
  o.frequency.setValueAtTime(f0, t0); if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, t0 + dur);
  g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + 0.004); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g); g.connect(dest || master); o.start(t0); o.stop(t0 + dur + 0.02);
}
let noiseBuf = null;
function noise(t0, dur, vol, fq, q) {
  if (!AC) return;
  if (!noiseBuf) { noiseBuf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate); const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }
  const s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
  s.buffer = noiseBuf; f.type = 'bandpass'; f.frequency.value = fq; f.Q.value = q || 1;
  g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  s.connect(f); f.connect(g); g.connect(master); s.start(t0, Math.random() * 0.5); s.stop(t0 + dur + 0.02);
}
let lastClink = 0;
const SFX = {
  // a quarter landing on quarters: two ringing partials, pitch a little random
  clink(vol, dull) {
    if (!AC) return; const t = AC.currentTime; if (t - lastClink < 0.012) return; lastClink = t;
    const p = 0.9 + Math.random() * 0.25, v = vol || 0.12;
    tone('triangle', 3900 * p, 3850 * p, t, dull ? 0.05 : 0.12, v); tone('sine', 6100 * p, 6000 * p, t, 0.07, v * 0.5); noise(t, 0.03, v * 0.6, 5000, 3);
  },
  // down the chute into the cup: a clatter of clinks on a hollow thud
  cup() { if (!AC) return; const t = AC.currentTime; for (let i = 0; i < 4; i++) tone('triangle', 2400 + Math.random() * 1800, 2000, t + 0.08 + i * 0.055, 0.1, 0.12); tone('sine', 220, 120, t + 0.3, 0.16, 0.5); noise(t + 0.28, 0.12, 0.3, 900, 2); },
  // into the house's bucket: farther away and duller
  house() { if (!AC) return; const t = AC.currentTime; tone('triangle', 2000, 1800, t + 0.25, 0.08, 0.05); tone('sine', 150, 90, t + 0.3, 0.14, 0.2); },
  // the player's shove on the cabinet
  bump(p) { if (!AC) return; const t = AC.currentTime; tone('sine', 90, 45, t, 0.16, 0.5 + 0.3 * p); noise(t, 0.08, 0.35, 500, 1); },
  // the flipper gate: a loud clunk (the video's "that was loud")
  gate() { if (!AC) return; const t = AC.currentTime; tone('square', 180, 70, t, 0.09, 0.45); noise(t, 0.12, 0.6, 1200, 1.2); tone('sine', 60, 40, t + 0.03, 0.2, 0.6); },
  reject() { if (!AC) return; const t = AC.currentTime; tone('square', 300, 200, t, 0.1, 0.15); },
  motorClunk() { if (!AC) return; const t = AC.currentTime; tone('sine', 110, 70, t, 0.08, 0.12); noise(t, 0.05, 0.1, 700, 1); },
  siren(on) {

    if (!on) { if (siren) { siren.g.gain.setTargetAtTime(0.0001, AC.currentTime, 0.03); siren.o.stop(AC.currentTime + 0.3); siren.l.stop(AC.currentTime + 0.3); siren = null; } return; }

    const o = AC.createOscillator(), g = AC.createGain(), l = AC.createOscillator(), lg = AC.createGain();
    o.type = 'square'; o.frequency.value = 1500; l.type = 'triangle'; l.frequency.value = 3.5; lg.gain.value = 600;
    l.connect(lg); lg.connect(o.frequency); g.gain.value = 0.22; o.connect(g); g.connect(master); o.start(); l.start();

const SLIDE_MS = 420;
const GAP_LEAD = (SLIDE_MS + 170) / 1000;     // s from a drop to the coin landing on the deck
let gapOpen = false;
const dropBtn = document.getElementById('drop'), gapEl = document.getElementById('gap');
const stats = { frames: 0, ms: 0, worst: 0, hist: [], simMs: 0, steps: 0 };
function newMachine() {
  sim.fresh((Date.now() ^ (POS * 7919)) >>> 0, CFG.quality[quality], 2.5);
  ledger = PL.ledger(); dirty = true;
}
function restoreMachine() {
  const u = PL.unpackMachine(load(MKEY, null));
  if (!u) { newMachine(); return false; }
  sim.restore(u); ledger = u.ledger; lipMm = u.lipMm; sim.setLip(lipMm);

}

}

// a drop: pays a quarter in, the coin slides down to the chute's foot, then it is the sim's
function drop() {
  if (!ready || paused) return;
  if (!BANK.spend(CFG.priceCents, NAME + ' drop')) { showFlash('NO MONEY', 'a drop is ' + window.MALLBANK.fmt(CFG.priceCents) + '; you have ' + window.MALLBANK.fmt(money())); ui(); setTimeout(hideFlash, 1800); SFX.reject(); return; }
  mirror(); ui();
  ledger.in++;
  slides.push({ x: sliderX, t0: now() });
  SFX.clink(0.06, true);
  dirty = true;
}
function nudge(power, source) {
  if (!ready || paused) return;
  const t = now(), r = PL.nudge(tiltLog, t, power);
  tiltLog = r.log; if (!r.accepted) return;
  ledger.nudges++;
  sim.nudge(0, 1, power);        // a shove on the front: the coins slide toward the player
  shake = 0.5 + power; SFX.bump(power);

  if (r.tripped && tiltAt === null) trip();
}
function trip() {
  tiltAt = now(); ledger.tilts++;
  showFlash('TILT', 'the gate is over: the house takes the next coins', true);
  SFX.siren(true); SFX.gate();
  setTimeout(() => { if (tiltAt !== null) hideFlash(); }, CFG.tiltAlarmMs);
}
function tiltTick() {
  const s = PL.tiltState(tiltAt, now());
  if (!s.alarm && siren) SFX.siren(false);
  if (s.gate !== gateNow) { gateNow = s.gate; sim.setGate(s.gate); if (s.gate === 'player') SFX.gate(); }
  if (tiltAt !== null && !s.alarm && s.gate === 'player' && !s.swinging) { tiltAt = null; tiltLog = null; meter(0); }
  gateMesh.rotation.x += ((s.gate === 'house' ? 0.9 : 0) - gateMesh.rotation.x) * 0.25;
  document.getElementById('meter').classList.toggle('hot', tiltAt !== null);
}
function meter(p) { document.getElementById('meterbar').style.width = Math.min(100, 100 * p / CFG.tiltTrip) + '%'; }
function onEvent(e) {
  ledger = PL.book(ledger, e.type);
  if (trackId && e.id === trackId) trackEvent = e.type;
  if (e.type === 'cup') {
    cupCount++; cupTotal++;
    // credited now (the picture follows); the machine is saved after this step so the coin can't fall twice
    BANK.credit(YEAR, CFG.ticketsPerCoin, NAME + ' cup', 'pusher:' + POS + ':' + SESSION + ':' + (++cupSeq)); mirror(); cupSaved = false;
    setTimeout(() => { ui(); SFX.cup(); plus(); const c = document.getElementById('cup'); c.classList.add('pop'); setTimeout(() => c.classList.remove('pop'), 200); }, 350);
  } else if (e.type === 'side') SFX.house();
  else if (e.type === 'house-tilt') { setTimeout(() => SFX.house(), 200); }
  dirty = true;
}
let lastPhase = 0;
function frame() {
  const t0 = now();
  const dt = Math.min(0.1, (t0 - (frame.last || t0)) / 1000); frame.last = t0;
  if (ready && !paused) {
    // coins that reached the chute's foot enter the sim
    for (let i = slides.length - 1; i >= 0; i--) if (t0 - slides[i].t0 >= SLIDE_MS) { sim.drop(slides[i].x); slides.splice(i, 1); }
    const s0 = now();
    const n0 = sim.steps;
    const ev = sim.step(dt);
    stats.simMs += now() - s0; stats.steps += sim.steps - n0;
    for (const e of ev) onEvent(e);
    if (!cupSaved) { saveMachine(); cupSaved = true; }
    // a clink when a dropped coin lands (its first second), and the motor's clunk at the crank's dead points
    const ph = (sim.t % GEOM.period) / GEOM.period;
    if ((lastPhase < 0.5 && ph >= 0.5) || (lastPhase > ph)) SFX.motorClunk();
    lastPhase = ph;
    for (const c of sim.coins.values()) {
      if (sim.t - c.born < 1.2 && !c.clinked) { const v = c.body.linvel(); if (c.body.translation().y < GEOM.deckY + 1.2 && Math.abs(v.y) < 12 && sim.t - c.born > 0.25) { c.clinked = true; SFX.clink(0.14); } }
    }
    tiltTick();
    if (dirty && t0 - lastSave > 4000) saveMachine();
  }
  if (sim) {
    // the cue: a coin dropped now reaches the deck in SLIDE_MS plus its fall; is the gap at the wall open then?
    const open = deckOutness(sim.t + GAP_LEAD, GEOM) > 0.6;
    if (open !== gapOpen) { gapOpen = open; knob.classList.toggle('open', open); dropBtn.classList.toggle('open', open); gapEl.classList.toggle('open', open); }
    deckMesh.position.z = -(G.Z_DROP + sim.deckZ() / 100);
    mechMesh.position.x = sliderX / 100;
    syncCoins();
  }
  if (shake > 0) { shake = Math.max(0, shake - dt * 3); shakeT += dt; }
  placeCamera();
  renderer.render(scene, camera);
  const ms = now() - t0;
  stats.frames++; stats.ms += ms; stats.worst = Math.max(stats.worst, ms); stats.hist.push(ms); if (stats.hist.length > 600) stats.hist.shift();
  requestAnimationFrame(frame);
}

// ------------------------------------------------------------------ input
const slot = document.getElementById('slot'), knob = document.getElementById('knob');
function setSlider(x) { sliderX = Math.max(-CFG.slotHalfW, Math.min(CFG.slotHalfW, x)); knob.style.left = (50 + 50 * sliderX / CFG.slotHalfW * 0.86) + '%'; }
let dragging = null;
function slotX(clientX) { const r = slot.getBoundingClientRect(); return ((clientX - r.left) / r.width * 2 - 1) / 0.86 * CFG.slotHalfW; }
stage.addEventListener('pointerdown', (e) => {
  if (e.target.closest('button') || e.target.closest('#msg')) return;
  unlock(); motionPermission();
  if (e.target === slot || e.target === knob) { dragging = { mode: 'slot' }; setSlider(slotX(e.clientX)); }
  else dragging = { mode: 'pan', x0: e.clientX, s0: sliderX, moved: false };
  stage.setPointerCapture && stage.setPointerCapture(e.pointerId);
});
stage.addEventListener('pointermove', (e) => {
  if (!dragging) return;
  if (dragging.mode === 'slot') setSlider(slotX(e.clientX));
  else { const dx = e.clientX - dragging.x0; if (Math.abs(dx) > 6) dragging.moved = true; setSlider(dragging.s0 + dx / stage.clientWidth * 2.2 * CFG.slotHalfW); }
});
stage.addEventListener('pointerup', (e) => {
  if (!dragging) return;
  if (dragging.mode === 'pan' && !dragging.moved && !e.target.closest('.chip')) drop();      // a tap drops
  dragging = null;
});
stage.addEventListener('pointercancel', () => { dragging = null; });
document.getElementById('drop').addEventListener('pointerdown', (e) => { e.stopPropagation(); unlock(); motionPermission(); drop(); });
document.getElementById('bump').addEventListener('pointerdown', (e) => { e.stopPropagation(); unlock(); nudge(0.7, 'button'); });
const keys = {};
window.addEventListener('keydown', (e) => {
  if (e.repeat) { keys[e.code] = true; return; }
  keys[e.code] = true; unlock();
  if (e.code === 'Space' || e.code === 'Enter' || e.code === 'KeyE') { e.preventDefault(); drop(); }
  else if (e.code === 'KeyN' || e.code === 'KeyB' || e.code === 'ShiftLeft' || e.code === 'ShiftRight') nudge(0.7, 'key');
  else if (e.code === 'Escape') back();
});
window.addEventListener('keyup', (e) => { keys[e.code] = false; });
const padPrev = {};
let padSeen = false;
window.addEventListener('gamepadconnected', () => { padSeen = true; ui(); });
function pollPads(dt) {
  const pads = navigator.getGamepads ? navigator.getGamepads() : [];
  let ax = 0;
  for (let i = 0; i < pads.length; i++) {
    const p = pads[i]; if (!p) continue;
    const a = p.buttons[0] && p.buttons[0].pressed, lb = p.buttons[4] && p.buttons[4].pressed, rb = p.buttons[5] && p.buttons[5].pressed;
    const bb = p.buttons[1] && p.buttons[1].pressed;
    const prev = padPrev[p.index] || {};
    if (a && !prev.a) drop();
    if ((lb && !prev.lb) || (rb && !prev.rb)) nudge(0.7, 'pad');
    if (bb && !prev.bb) back();
    const x = p.axes[0] || 0, dl = p.buttons[14] && p.buttons[14].pressed, dr = p.buttons[15] && p.buttons[15].pressed;
    if (Math.abs(x) > 0.2) ax = x; if (dl) ax = -1; if (dr) ax = 1;
    padPrev[p.index] = { a, lb, rb, bb };
  }
  return ax;
}
function inputTick(dt) {
  let ax = pollPads(dt);
  if (keys.ArrowLeft || keys.KeyA) ax = -1; if (keys.ArrowRight || keys.KeyD) ax = 1;
  if (ax) setSlider(PL.slide(sliderX, ax, dt));
}
// a shake of the phone is a nudge (iOS asks for permission inside a tap)
let motionAsked = false, lastShake = 0;
function motionPermission() {
  if (motionAsked || typeof DeviceMotionEvent === 'undefined') return;
  motionAsked = true;
  if (typeof DeviceMotionEvent.requestPermission === 'function') DeviceMotionEvent.requestPermission().then((r) => { if (r === 'granted') listenMotion(); }).catch(() => {});
  else listenMotion();
}
function listenMotion() {
  window.addEventListener('devicemotion', (e) => {
    const a = e.acceleration; if (!a) return;
    const m = Math.hypot(a.x || 0, a.y || 0, a.z || 0);
    if (m > 9 && now() - lastShake > CFG.nudgeMinMs) { lastShake = now(); nudge(Math.min(1, (m - 6) / 14), 'shake'); }
  });
}

// ------------------------------------------------------------------ HUD
const flashEl = document.getElementById('flash');
function showFlash(a, b, tilt) { flashEl.innerHTML = a + (b ? '<small style="display:block;font-size:.4em;letter-spacing:.1em">' + b + '</small>' : ''); flashEl.style.opacity = 1; flashEl.classList.toggle('tilt', !!tilt); }
function hideFlash() { flashEl.style.opacity = 0; flashEl.classList.remove('tilt'); }
function ui() {
  document.getElementById('qn').textContent = window.MALLBANK.fmt(money());
  document.getElementById('tn').textContent = tickets();
  document.getElementById('cup').textContent = 'CUP · ' + cupTotal + (cupTotal ? ' coins · ' + cupTotal * CFG.ticketsPerCoin + ' tickets' : '');
  document.getElementById('hint').textContent = mobile ? 'Drag to aim · tap to drop · shake or NUDGE to bump' : 'Drag or ← → to aim · Space/E/click to drop · N or Shift to nudge' + (padSeen ? ' · pad: stick, A, shoulders' : '');
}
// a coin into the cup: "+50" (tickets) rises from the cup
function plus() { const d = document.createElement('div'); d.className = 'plus'; d.textContent = '+' + CFG.ticketsPerCoin; document.getElementById('stage').appendChild(d); setTimeout(() => d.remove(), 1100); }
function title() {
  const m = document.getElementById('msg');
  m.innerHTML = '<div class="card"><h2>' + esc(NAME) + '</h2><p>Slide the coin slot and drop your quarters onto the top shelf <b>while it is out</b>: the gap at the back wall is where a coin does its work. ' +
    'The shelf shoves its coins down onto the main tier, and pushes that heap over the front edge: every coin that falls pays <b>' + CFG.ticketsPerCoin + ' tickets</b>. ' +
    'Bump the machine if you must, but too much trips the <b>TILT</b>.</p><p>Each drop is <b>' + window.MALLBANK.fmt(CFG.priceCents) + '</b>. You have <b>' + window.MALLBANK.fmt(money()) + '</b> and <b>' + tickets() + '</b> tickets.</p><button class="big" id="go">PLAY</button></div>';
  m.querySelector('#go').addEventListener('pointerdown', (e) => { e.stopPropagation(); });
  m.querySelector('#go').addEventListener('click', (e) => { e.stopPropagation(); m.innerHTML = ''; unlock(); motionPermission(); paused = false; });
  paused = true;
}
function esc(s) { return String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
function back() { saveMachine(); SFX.siren(false); if (AC) { try { AC.close(); } catch (e) {} } if (inFrame) window.parent.postMessage('emu-close', '*'); else if (history.length > 1) history.back(); }
document.getElementById('back').addEventListener('click', back);
const sndBtn = document.getElementById('snd');
function sndUi() { sndBtn.innerHTML = soundOn ? '&#128266;' : '&#128263;'; }
sndBtn.addEventListener('click', () => { soundOn = !soundOn; save('pusher.sound', soundOn); unlock(); if (master) master.gain.value = soundOn ? 0.6 : 0; sndUi(); });
sndUi();
// owner settings: the lip, the coin count, a refill
const setEl = document.getElementById('set');
if (isOwner) document.getElementById('gear').style.display = '';
document.getElementById('gear').addEventListener('click', () => { setEl.style.display = 'block'; paused = true; settingsUi(); });
document.getElementById('setclose').addEventListener('click', () => { setEl.style.display = 'none'; paused = false; saveMachine(); });
const lipIn = document.getElementById('lip'), qIn = document.getElementById('quality');
function settingsUi() {
  lipIn.value = lipMm; qIn.value = quality;
  for (const o of qIn.options) o.textContent = o.value[0].toUpperCase() + o.value.slice(1) + ' (' + CFG.quality[o.value] + ')';
  document.getElementById('lipv').textContent = lipMm.toFixed(1) + ' mm over the main tier (the house\'s payout control; 0 = off)';
  const avg = stats.frames ? stats.ms / stats.frames : 0;
  document.getElementById('stat').textContent = 'Position ' + POS + ' · ' + sim.count() + ' coins (' + sim.awake() + ' awake) · ' + avg.toFixed(1) + ' ms a frame (worst ' + stats.worst.toFixed(0) + ')\n' +
    'Ledger: in ' + ledger.in + ' · cup ' + ledger.cup + ' · lost at the sides ' + ledger.side + ' · tilt ' + ledger.tilt + ' · nudges ' + ledger.nudges + ' · tilts ' + ledger.tilts + ' · RTP ' + (100 * PL.rtp(ledger)).toFixed(0) + '%';
}
lipIn.addEventListener('input', () => { applyLip(parseFloat(lipIn.value)); settingsUi(); });
qIn.addEventListener('change', () => { quality = qIn.value; save('pusher.quality', quality); if (confirm('Refill this position with ' + CFG.quality[quality] + ' coins?')) { newMachine(); saveMachine(); } settingsUi(); });
document.getElementById('reset').addEventListener('click', () => { if (confirm('Refill position ' + POS + '? Its heaps start fresh.')) { newMachine(); cupTotal = 0; saveMachine(); settingsUi(); ui(); } });
window.addEventListener('pagehide', saveMachine);
document.addEventListener('visibilitychange', () => { if (document.hidden) saveMachine(); });

// ------------------------------------------------------------------ start
(async function start() {
  try {
    await loadAll();
    await RAPIER.init({});
    document.getElementById('lbar').style.width = '95%';
    buildLight(); buildCabinet(); buildCoins(); resize();
    sim = createSim(RAPIER, { lipMm: CFG.lipMm, hz: SIM_HZ });
    const restored = TESTING && Q.get('fresh') === '1' ? (newMachine(), false) : restoreMachine();
    applyLip(lipMm);
    saveMachine();
    document.getElementById('load').style.display = 'none';
    ready = true;
    ui(); setSlider(0);
    if (!TESTING) title(); else paused = false;
    let last = now();
    setInterval(() => { const t = now(); inputTick((t - last) / 1000); last = t; }, 16);
    requestAnimationFrame(frame);
    window.PUSHER_PAGE = { dbg() {
        const pr = (v) => { const w = v.clone().project(camera); return [((w.x + 1) / 2 * stage.clientWidth).toFixed(0), ((1 - w.y) / 2 * stage.clientHeight).toFixed(0)]; };
        let sz = -9, szc = null; for (const c of sim.coins.values()) { const q = c.body.translation(); if (q.y < 3 && q.z > sz) { sz = q.z; szc = q; } }
        const dm = new T3.Vector3(); deckMesh.getWorldPosition(dm);
        let dmin = null, dmax = null; for (const c of sim.coins.values()) { const q = c.body.translation(); if (q.y > 3) { if (!dmin || q.z < dmin.z) dmin = q; if (!dmax || q.z > dmax.z) dmax = q; } }
        return { deckCoinMin: [dmin.x, dmin.y, dmin.z, pr(S2W(dmin.x, dmin.y, dmin.z))], deckCoinMax: [dmax.z, pr(S2W(dmax.x, dmax.y, dmax.z))], riserTop: pr(V(0, G.Y_PT, G.Z_DROP + sim.deckZ() / 100)), wallFoot: pr(V(0, G.Y_PT, G.Z_WALL)), stageTop: stage.getBoundingClientRect().top,
          lip: pr(V(0, G.Y_SH, G.Z_DROP)), shelfBack: pr(S2W(szc.x, szc.y, szc.z)), riser: pr(V(0, G.Y_SH, G.Z_DROP + sim.deckZ() / 100)), deckMeshZ: dm.z, riserExpected: -(G.Z_DROP + sim.deckZ() / 100), coin0: coinMesh.count, firstCoin: (() => { const m = new T3.Matrix4(); coinMesh.getMatrixAt(0, m); return new T3.Vector3().setFromMatrixPosition(m).toArray(); })(), firstSim: sim.coins.values().next().value.body.translation() };
      }, sim, drop, nudge, trip, stats, onEvent, get ledger() { return ledger; }, get gate() { return gateNow; }, get tiltAt() { return tiltAt; },
      money, tickets, BANK, setSlider, saveMachine, restored, G: GEOM, get gapOpen() { return gapOpen; },
      // the coin-path recording (tests/unit/pusher/coin_path.py): ring one coin, report where it is, draw a frame on demand
      track(id) { trackId = id; trackEvent = null; if (!trackMesh) { trackMesh = new T3.Mesh(new T3.TorusGeometry(0.0175, 0.0028, 8, 24), new S({ color: 0xff3a1e, emissive: 0xff3a1e, emissiveIntensity: 1.5 })); trackMesh.rotation.x = Math.PI / 2; scene.add(trackMesh); } },
      tracked() { for (const c of sim.coins.values()) if (c.id === trackId) { const p = c.body.translation(); return { x: p.x, y: p.y, z: p.z, t: sim.t, G: GEOM, deckZ: sim.deckZ() }; } for (const e of sim.lastEvents || []) if (e.id === trackId) trackEvent = e.type; return null; },
      get trackedEvent() { return trackEvent; },
      draw() { deckMesh.position.z = -(G.Z_DROP + sim.deckZ() / 100); syncCoins(); placeCamera(); renderer.render(scene, camera); }, get cupTotal() { return cupTotal; }, applyLip, newMachine, get paused() { return paused; }, set paused(v) { paused = v; } };
  } catch (e) {
    document.getElementById('lerr').textContent = e && e.message ? e.message : String(e);
    console.error(e);
  }
})();
</script>
